appId: com.remirror.app
productName: Remirror
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/icons/**/*
asar: true
asarUnpack:
  - "**/*.node"
win:
  target: nsis
  icon: resources/icons/app.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

# Auto-update host. electron-updater reads `latest.yml` from this URL on each
# app launch and downloads new installers when version increases.
# To publish a new release: `npm run release:win` (see package.json scripts).
publish:
  provider: github
  owner: Jdeildale
  repo: remirror
  releaseType: release
